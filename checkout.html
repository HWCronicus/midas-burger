<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midas Burger | Checkout</title>
    <meta
      name="description"
      content="Review your cart and complete the Midas Burger demo checkout flow. (This is a demo site for educational purposes.)"
    />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Midas Burger | Checkout" />
    <meta
      property="og:description"
      content="Review your cart and complete the Midas Burger demo checkout flow. (This is a demo site for educational purposes.)"
    />
    <meta
      property="og:url"
      content="https://midas-burger.alangeorge.dev/checkout.html"
    />
    <meta
      property="og:image"
      content="https://midas-burger.alangeorge.dev/assets/images/logo.png"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/checkout.css" />
    <script src="./js/main.js" defer></script>
    <script src="./js/cart.js" defer></script>
    <script src="./js/checkout.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header class="top-bar">
        <div class="top-bar-contents">
          <div class="logo-container">
            <a class="logo-link" href="./index.html" aria-label="Midas home">
              <img src="./assets/images/logo.png" alt="Midas logo" />
            </a>
          </div>

          <div class="nav-container" aria-label="Primary navigation">
            <button
              class="nav-hamburger-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="primary-navigation"
              aria-label="Open navigation menu"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>
            <nav class="nav" id="primary-navigation">
              <a href="./index.html">home</a>
              <a href="./locations.html">location</a>
              <a href="./about.html">about us</a>
              <a href="./menu.html">menu</a>
            </nav>
          </div>

          <button class="cart-button" type="button" aria-label="Shopping cart">
            <span class="cart-count"></span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="20" r="1.4"></circle>
              <circle cx="17" cy="20" r="1.4"></circle>
              <path
                d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.5l1.4-6.3H7.1"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <main id="checkout">
        <section class="checkout-content">
          <div class="eyebrow">Checkout</div>
          <h1>Review Your Cart</h1>
          <p id="checkout-empty" class="checkout-empty" hidden>
            Your cart is empty.
          </p>

          <section id="checkout-review-stage" aria-label="Cart review">
            <div id="checkout-items" class="checkout-items"></div>
            <div id="checkout-review-total" class="checkout-total" hidden></div>
            <div
              id="checkout-review-actions"
              class="checkout-review-actions"
              hidden
            >
              <button class="checkout-confirm-button" type="button">
                Checkout
              </button>
            </div>
          </section>

          <div id="checkout-details-stage" class="checkout-layout" hidden>
            <section class="checkout-review-panel" aria-label="Order summary">
              <h2 class="checkout-panel-title">Cart Review</h2>
              <div id="checkout-summary-items" class="checkout-items"></div>
              <div id="checkout-summary-total" class="checkout-total"></div>
            </section>

            <section class="checkout-form-panel" aria-label="Checkout form">
              <h2 class="checkout-panel-title">Checkout Details</h2>
              <form id="checkout-form" class="checkout-form" novalidate>
                <label class="checkout-field">
                  <span>First Name</span>
                  <input
                    name="firstName"
                    type="text"
                    autocomplete="given-name"
                    placeholder="First Name"
                    required
                  />
                </label>
                <label class="checkout-field">
                  <span>Last Name</span>
                  <input
                    name="lastName"
                    type="text"
                    autocomplete="family-name"
                    placeholder="Last Name"
                    required
                  />
                </label>
                <label class="checkout-field">
                  <span>Phone Number</span>
                  <input
                    name="phone"
                    type="tel"
                    inputmode="tel"
                    autocomplete="tel"
                    placeholder="(123) 456-7890"
                    maxlength="14"
                    pattern="\(\d{3}\) \d{3}-\d{4}"
                    required
                  />
                </label>
                <label class="checkout-field">
                  <span>Address</span>
                  <input
                    name="address"
                    type="text"
                    autocomplete="street-address"
                    placeholder="123 Main St"
                    required
                  />
                </label>
                <div class="checkout-field-row checkout-field-row-triple">
                  <label class="checkout-field">
                    <span>City</span>
                    <input
                      name="city"
                      type="text"
                      autocomplete="address-level2"
                      placeholder="Jacksonville"
                      required
                    />
                  </label>
                  <label class="checkout-field">
                    <span>State</span>
                    <input
                      name="state"
                      type="text"
                      autocomplete="address-level1"
                      maxlength="2"
                      placeholder="FL"
                      required
                    />
                  </label>
                  <label class="checkout-field">
                    <span>Zip Code</span>
                    <input
                      name="zipCode"
                      type="text"
                      inputmode="numeric"
                      autocomplete="postal-code"
                      maxlength="5"
                      pattern="\d{5}"
                      placeholder="32207"
                      required
                    />
                  </label>
                </div>
                <label class="checkout-field">
                  <span>Credit Card Number</span>
                  <input
                    name="cardNumber"
                    type="text"
                    inputmode="numeric"
                    autocomplete="cc-number"
                    placeholder="XXXX XXXX XXXX XXXX"
                    required
                  />
                </label>
                <div class="checkout-field-row">
                  <label class="checkout-field">
                    <span>Security Code</span>
                    <input
                      name="securityCode"
                      type="text"
                      inputmode="numeric"
                      autocomplete="cc-csc"
                      placeholder="XXX"
                      maxlength="4"
                      pattern="\d{3,4}"
                      required
                    />
                  </label>
                  <label class="checkout-field">
                    <span>Exp Date</span>
                    <input
                      name="expDate"
                      type="text"
                      inputmode="numeric"
                      maxlength="5"
                      placeholder="MM/YY"
                      pattern="(0[1-9]|1[0-2])/[0-9]{2}"
                      autocomplete="cc-exp"
                      required
                    />
                  </label>
                </div>
                <div class="checkout-form-actions">
                  <button class="checkout-clear-button" type="reset">
                    Clear Form
                  </button>
                  <button class="checkout-submit-button" type="submit">
                    Submit Order
                  </button>
                </div>
              </form>
            </section>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
