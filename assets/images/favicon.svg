<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%"
    height="100%">
    <defs>
        <!-- Main gold gradient for the crown/top bun -->
        <linearGradient id="goldMain" x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stop-color="#e2c46f" />
            <stop offset="50%" stop-color="#c8a24a" />
            <stop offset="100%" stop-color="#8f6b1f" />
        </linearGradient>

        <!-- Reverse gold gradient for the bottom bun -->
        <linearGradient id="goldBottom" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8f6b1f" />
            <stop offset="60%" stop-color="#c8a24a" />
            <stop offset="100%" stop-color="#e2c46f" />
        </linearGradient>
    </defs>

    <!-- Background: Smooth Black App-like Square -->
    <rect width="100" height="100" rx="22" fill="#0a0a0a" />

    <!-- Top Bun: The Midas Crown -->
    <path
        d="M 18 50
           L 14 24
           L 32 35
           L 50 18
           L 68 35
           L 86 24
           L 82 50
           Q 50 60 18 50 Z"
        fill="url(#goldMain)" />

    <!-- The Burger Patty: Using the darkest gold to anchor the center -->
    <rect x="16" y="56" width="68" height="10" rx="5" fill="#8f6b1f" />

    <!-- The Bottom Bun -->
    <path
        d="M 18 70
           Q 50 66 82 70
           C 82 86 66 90 50 90
           C 34 90 18 86 18 70 Z"
        fill="url(#goldBottom)" />
</svg>